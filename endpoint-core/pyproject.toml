[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-endpoint-core"
version = "0.1.0"
description = "NEXUS OS-agnostic endpoint core: process graph, rule engine, incident builder, store, transport, response gate"
readme = "README.md"
requires-python = ">=3.11"
# nexus-contracts comes from the repository root: install it first (pip install -e .)
dependencies = [
  "nexus-contracts>=1.0.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["nexus_endpoint_core"]

# `pytest endpoint-core` (from the repo root) or `pytest` (inside this folder) test the INSTALLED package:
# run `pip install -e ./endpoint-core` first. No sys.path or pythonpath tricks.
[tool.pytest.ini_options]
testpaths = ["tests"]
