[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-contracts"
version = "1.0.0"
description = "NEXUS shared contracts: JSON schemas, Pydantic models, fixtures"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "jsonschema>=4.21",
  "referencing>=0.33",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
tools = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "pytest>=8"]

[tool.pytest.ini_options]
# A bare `pytest` at the repo root runs the contracts/tools tests, exactly like CI (`pytest -q tests/`).
# Each package is tested on its own after installing it: `pip install -e ./endpoint-core && pytest endpoint-core`.
testpaths = ["tests"]

[tool.setuptools]
packages = ["nexus_contracts"]
include-package-data = true

[tool.setuptools.package-data]
nexus_contracts = ["../contracts/schemas/*.json"]
